<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="Logilift">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29ABE2"/>
      <stop offset="1" stop-color="#1C75BC"/>
    </linearGradient>
  </defs>

  <!-- Pictogramme : camion stylisé dans un disque, esprit transport/logistique -->
  <g transform="translate(20 28)">
    <circle cx="60" cy="60" r="58" fill="#ffffff" stroke="#1C75BC" stroke-width="4"/>
    <path d="M18 78 L18 50 L70 50 L70 44 L86 44 L98 60 L102 78 Z" fill="#1C75BC"/>
    <rect x="22" y="40" width="44" height="10" rx="2" fill="#F58220"/>
    <circle cx="38" cy="80" r="9" fill="#1f2937"/>
    <circle cx="38" cy="80" r="4" fill="#ffffff"/>
    <circle cx="88" cy="80" r="9" fill="#1f2937"/>
    <circle cx="88" cy="80" r="4" fill="#ffffff"/>
    <path d="M74 50 L88 50 L98 62 L98 66 L74 66 Z" fill="#29ABE2"/>
  </g>

  <!-- Lettrage -->
  <text x="160" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    <tspan fill="#1C75BC">Logi</tspan><tspan fill="#F58220">lift</tspan>
  </text>

  <!-- Bandeau slogan -->
  <rect x="160" y="120" width="330" height="34" rx="17" fill="url(#ribbon)"/>
  <text x="325" y="143" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-style="italic" font-weight="600" fill="#ffffff">Le transit qui fait avancer vos affaires</text>
</svg>
